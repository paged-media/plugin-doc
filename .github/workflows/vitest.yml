name: vitest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # paged.doc consumes the PUBLISHED @paged-media canaries (no link chain),
      # so a plain install suffices.
      - run: pnpm install --frozen-lockfile
      - name: contract-import lint (fail fast)
        run: node scripts/check-contract-imports.mjs
      - name: typecheck
        run: pnpm -r run typecheck
      - name: validate manifest
        run: node ../plugin-sdk/packages/plugin-cli/bin/paged-plugin.mjs validate packages/doc-bundle/manifest.json || true
      - name: vitest (junit per package; red results still publish)
        run: |
          pnpm -r --no-bail exec \
            vitest run --reporter=junit --outputFile=junit.xml || true
          cat packages/*/junit.xml > junit-all.xml 2>/dev/null || true
          [ -s junit-all.xml ]
      # plugin-doc is a PUBLIC repo and the publish-results action lives in the
      # PRIVATE paged-media/state repo. GitHub refuses to resolve a private
      # repo's action from a public workflow ("Unable to resolve action
      # paged-media/state, not found"), which failed this job at SET-UP — before
      # any step ran — on all 18 runs since the workflow was added. So we follow
      # core/ci.yml's inverted pattern: upload the JUnit as an artifact, and let
      # state pull it (private state CAN read a public repo's artifacts).
      - name: upload vitest JUnit artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: junit-all.xml
          if-no-files-found: error
          retention-days: 14
