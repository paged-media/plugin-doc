# cargo-deny configuration for paged.doc.
# Run:  cargo deny check          (CI runs `check licenses bans sources`)
#
# This doubles as the SDK-only rule's Rust half: [sources] denies unknown
# registries/git, so a path/git reach-around into core/editor internals — or
# into another plugin — cannot land silently. paged.doc has NO core dependency;
# the only third-party OOXML code is the vendored `ooxmlsdk` (MIT OR Apache-2.0).

[advisories]
version = 2
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Dependencies must be permissively licensed so `paged-ooxml` (MPL-2.0) can be
# distributed as a shared embeddable library. ooxmlsdk + its deps are MIT /
# Apache-2.0.
allow = [
    "MPL-2.0",
    # Our own crates: paged-ooxml is MPL-2.0 OR PMEL; the docx-* plugin crates
    # are AGPL-3.0-only OR PMEL. SPDX has no id for PMEL (the LicenseRef form).
    "LicenseRef-PMEL",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
