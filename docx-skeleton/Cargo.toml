[package]
name = "docx-skeleton"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "paged.doc standalone open (thoughts ADR 029): a Word document's SECTIONS as a page skeleton (a page per section, its margin-box frame, an empty story) written as a minimal IDML package for host.nativeDocument.open. No core dependency. The bundle sets each story's grow rule on the wire and pours it afterwards."

[lints]
workspace = true

[dependencies]
docx-core.workspace = true
docx-lower.workspace = true
zip.workspace = true

[dev-dependencies]
docx-conformance = { path = "../docx-conformance" }
docx-import.workspace = true
quick-xml.workspace = true
