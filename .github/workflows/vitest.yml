name: vitest
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vitest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # paged.doc consumes the PUBLISHED @paged-media canaries (no link chain),
      # so a plain install suffices.
      - run: pnpm install --frozen-lockfile
      - name: contract-import lint (fail fast)
        run: node scripts/check-contract-imports.mjs
      - name: typecheck
        run: pnpm -r run typecheck
      - name: validate manifest
        run: node ../plugin-sdk/packages/plugin-cli/bin/paged-plugin.mjs validate packages/doc-bundle/manifest.json || true
      - name: vitest (junit per package; red results still publish)
        run: |
          pnpm -r --no-bail exec \
            vitest run --reporter=junit --outputFile=junit.xml || true
          cat packages/*/junit.xml > junit-all.xml 2>/dev/null || true
          [ -s junit-all.xml ]
      - uses: paged-media/state/actions/publish-results@main
        if: ${{ always() }}
        with:
          source: plugin-doc
          suite: vitest
          format: nextest-junit
          path: junit-all.xml
          map: "true"
          dispatch-token: ${{ secrets.STATE_DISPATCH_TOKEN }}
